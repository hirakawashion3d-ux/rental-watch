name: Rental Watch One Shot 20260806 0653

on:
  push:
    paths:
      - '.github/workflows/rental-watch-one-shot-20260806-0653.yml'

permissions:
  contents: write

jobs:
  update-rental-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update rental JSON and remove workflow
        env:
          PROP_B64: 
          UPDATE_B64: 
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path

          prop = json.loads(base64.b64decode(os.environ['PROP_B64']).decode('utf-8'))
          update = json.loads(base64.b64decode(os.environ['UPDATE_B64']).decode('utf-8'))

          pp = Path('data/properties.json')
          up = Path('data/updates.json')
          properties = json.loads(pp.read_text(encoding='utf-8'))
          updates = json.loads(up.read_text(encoding='utf-8'))

          def same_room(p):
              return (
                  p.get('id') == prop['id']
                  or (
                      p.get('name') == prop['name']
                      and p.get('room') == prop['room']
                      and p.get('address') == prop['address']
                      and p.get('rent') == prop['rent']
                      and p.get('area') == prop['area']
                  )
              )

          properties = [p for p in properties if not same_room(p)]
          properties.append(prop)
          updates = [u for u in updates if u.get('id') != update['id']]
          updates.insert(0, update)

          pp.write_text(json.dumps(properties, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          up.write_text(json.dumps(updates, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
          rm .github/workflows/rental-watch-one-shot-20260806-0653.yml
          git config user.name 'ChatGPT Rental Watch'
          git config user.email 'actions@users.noreply.github.com'
          git add data/properties.json data/updates.json .github/workflows/rental-watch-one-shot-20260806-0653.yml
          git commit -m 'Update rental listings 2026-08-06 06:53 JST'
          git push
