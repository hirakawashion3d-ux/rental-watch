name: Rental Watch One Shot

on:
  push:
    paths:
      - '.github/workflows/rental-watch-one-shot-20260804-2356.yml'

permissions:
  contents: write

jobs:
  update-rental-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update JSON data and remove one-shot workflow
        env:
          PROP_B64: 
          UPDATE_B64: 
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path

          prop = json.loads(base64.b64decode(os.environ['PROP_B64']).decode('utf-8'))
          update = json.loads(base64.b64decode(os.environ['UPDATE_B64']).decode('utf-8'))

          properties_path = Path('data/properties.json')
          updates_path = Path('data/updates.json')
          properties = json.loads(properties_path.read_text(encoding='utf-8'))
          updates = json.loads(updates_path.read_text(encoding='utf-8'))

          properties = [p for p in properties if p.get('id') != prop['id']]
          properties.append(prop)
          updates = [u for u in updates if u.get('id') != update['id']]
          updates.insert(0, update)

          properties_path.write_text(json.dumps(properties, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          updates_path.write_text(json.dumps(updates, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
          rm .github/workflows/rental-watch-one-shot-20260804-2356.yml
          git config user.name 'ChatGPT Rental Watch'
          git config user.email 'actions@users.noreply.github.com'
          git add data/properties.json data/updates.json .github/workflows/rental-watch-one-shot-20260804-2356.yml
          git commit -m 'Update rental listings 2026-08-04 23:56 JST'
          git push
