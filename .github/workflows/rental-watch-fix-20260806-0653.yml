name: Rental Watch Fix 20260806 0653

on:
  push:
    paths:
      - '.github/workflows/rental-watch-fix-20260806-0653.yml'

permissions:
  contents: write

jobs:
  fix-rental-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct text and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('data/properties.json', 'data/updates.json'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('優先庖', '優先度').replace('要電謱確認', '要電話確認')
              path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/rental-watch-fix-20260806-0653.yml
          git config user.name 'ChatGPT Rental Watch'
          git config user.email 'actions@users.noreply.github.com'
          git add data/properties.json data/updates.json .github/workflows/rental-watch-fix-20260806-0653.yml
          git commit -m 'Update rental listings 2026-08-06 06:53 JST'
          git push
