name: Rental watch one-time data sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rental-update-once.yml
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.issue.title == 'Run rental watch sync 2026-08-07 06:56 JST'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified rental changes
        run: python scripts/rental_update_once.py
      - name: Commit synchronized data update
        run: |
          git config user.name "rental-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/properties.json data/updates.json
          git rm .github/workflows/rental-update-once.yml scripts/rental_update_once.py
          git commit -m "Update rental listings 2026-08-07 06:56 JST"
          git push origin main
      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
