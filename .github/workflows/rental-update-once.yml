          properties_path.write_text(json.dumps(properties, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          updates_path.write_text(json.dumps(updates, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Commit synchronized data update
        shell: bash
        run: |
          git config user.name "rental-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/properties.json data/updates.json
          git rm .github/workflows/rental-update-once.yml
          git commit -m "Update rental listings 2026-08-07 06:56 JST"
          git push origin main
