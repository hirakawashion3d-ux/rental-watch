name: Manual GitHub Pages diagnostic

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# Automatic custom-workflow deployment is paused because GitHub Pages accepts
# the artifact but leaves the deployment in deployment_queued until timeout.
# Keep production deployments serialized and never cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Validate rental JSON
        run: |
          python -m json.tool data/properties.json >/dev/null
          python -m json.tool data/updates.json >/dev/null

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/
          cp .nojekyll _site/
          cp -R src data _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./_site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000

  rental-sync:
    if: github.event_name == 'issues' && github.event.issue.title == 'Run registered rental sync 2026-08-07 06:56 JST'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified rental changes
        run: python scripts/rental_update_once.py
      - name: Restore workflow and commit synchronized data
        run: |
          git config user.name "rental-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/deploy.yml
          git rm -f .github/workflows/rental-update-once.yml scripts/rental_update_once.py
          git add data/properties.json data/updates.json .github/workflows/deploy.yml
          git commit -m "Update rental listings 2026-08-07 06:56 JST"
          git push origin main
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
