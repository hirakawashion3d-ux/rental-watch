name: Manual GitHub Pages diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Main-branch deployment re-enabled with user approval for this tracker.
# Prior deployments stalled in deployment_queued; verify each result.
# Keep production deployments serialized and never cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Validate rental JSON
        run: |
          python -m json.tool data/properties.json >/dev/null
          python -m json.tool data/updates.json >/dev/null

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/
          cp .nojekyll _site/
          cp -R src data _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./_site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
