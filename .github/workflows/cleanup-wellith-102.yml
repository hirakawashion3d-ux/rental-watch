name: One-time rental listing cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-wellith-102.yml
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: github.event_name == 'push' || github.event.issue.title == 'Run one-time Wellith 102 cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove invalid listing and record exclusion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          property_id = "wellith-urban-sumiyoshi-east-102"
          properties_path = Path("data/properties.json")
          updates_path = Path("data/updates.json")

          properties = json.loads(properties_path.read_text(encoding="utf-8"))
          filtered = [item for item in properties if item.get("id") != property_id]
          if len(filtered) == len(properties):
              raise SystemExit(f"Property not found: {property_id}")

          update = {
              "id": "u-20260807-0356-wellith-urban-sumiyoshi-east-102-ended",
              "propertyId": property_id,
              "timestamp": "2026-08-07T03:56:09+09:00",
              "type": "ended",
              "title": "ウエリスアーバン住吉EAST 102号室を終了・条件外として除外",
              "description": "HOME'Sの102号室直接ページで『現在この物件はお問合せできません』を確認。SUUMOの残存掲載は正式更新日が2026-04-14で古く、賃料14.4万円＋管理費1万円＝総額15.4万円と上限超過。現在の有効な募集を裏付けられず、必須条件からも外れるため現行一覧から除外。",
              "previousValue": "1階・要確認候補／総額15万円として追跡",
              "newValue": "終了・条件外／propertiesから除外",
              "links": [
                  {
                      "label": "HOME'S 102号室",
                      "url": "https://www.homes.co.jp/chintai/b-1352110380072/",
                      "status": "ended",
                      "note": "問い合わせ不可を明記"
                  },
                  {
                      "label": "SUUMO 102号室の残存掲載",
                      "url": "https://suumo.jp/chintai/jnc_000105130884/?bc=100492622472",
                      "status": "stale",
                      "note": "2026-04-14更新、総額15.4万円で条件超過"
                  }
              ]
          }

          updates = json.loads(updates_path.read_text(encoding="utf-8"))
          updates = [item for item in updates if item.get("id") != update["id"]]
          updates.insert(0, update)

          properties_path.write_text(
              json.dumps(filtered, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          updates_path.write_text(
              json.dumps(updates, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )

          Path(".github/workflows/cleanup-wellith-102.yml").unlink()
          PY

      - name: Commit synchronized rental data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/properties.json data/updates.json .github/workflows/cleanup-wellith-102.yml
          git commit -m "Update rental listings 2026-08-07 03:56 JST"
          git push origin main

      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
