name: Rental Watch One Shot 20260806 0452

on:
  push:
    paths:
      - '.github/workflows/rental-watch-20260806-0452.yml'

permissions:
  contents: write

jobs:
  update-rental-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update rental JSON and remove temp files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('.github/rental-watch-20260806-0452.json').read_text(encoding='utf-8'))
          prop = payload['property']
          update = payload['update']

          properties_path = Path('data/properties.json')
          updates_path = Path('data/updates.json')
          properties = json.loads(properties_path.read_text(encoding='utf-8'))
          updates = json.loads(updates_path.read_text(encoding='utf-8'))

          properties = [p for p in properties if p.get('id') != prop['id']]
          properties.insert(0, prop)
          updates = [u for u in updates if u.get('id') != update['id']]
          updates.insert(0, update)

          properties_path.write_text(json.dumps(properties, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          updates_path.write_text(json.dumps(updates, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
          rm .github/workflows/rental-watch-20260806-0452.yml
          rm .github/rental-watch-20260806-0452.json
          git config user.name 'ChatGPT Rental Watch'
          git config user.email 'actions@users.noreply.github.com'
          git add data/properties.json data/updates.json .github/workflows/rental-watch-20260806-0452.yml .github/rental-watch-20260806-0452.json
          git commit -m 'Update rental listings 2026-08-06 04:52 JST'
          git push
